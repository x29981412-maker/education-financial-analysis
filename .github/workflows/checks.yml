name: 数据复算

on: [push, pull_request]

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python analysis.py
      - run: git diff --exit-code -- results/indicators.csv results/checks.csv results/cashflow_bridge.csv paper/report.md
